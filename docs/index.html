<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>問題一覧 | 競プロ教材</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],ignoredTags:['script','noscript','style','pre','code']})"></script>
</head>
<body>
<script>(function(){var H="__VIEW_PASSWORD__";if(H.indexOf('__')===0)return;if(sessionStorage.getItem('cps')===H)return;var o=document.createElement('div');o.style='position:fixed;inset:0;background:#1565c0;display:flex;align-items:center;justify-content:center;z-index:9999';o.innerHTML='<div style="background:#fff;border-radius:12px;padding:32px;max-width:320px;width:90%;text-align:center"><div style="font-size:1.4rem;font-weight:700;margin-bottom:8px">&#127891; 競プロ教材</div><div style="color:#666;font-size:.85rem;margin-bottom:20px">パスワードを入力してください</div><input type="password" id="pwi" style="width:100%;border:1.5px solid #ccc;border-radius:8px;padding:10px;font-size:1rem;margin-bottom:10px;box-sizing:border-box" placeholder="パスワード"><div id="pwe" style="color:#f44336;font-size:.8rem;height:1.2em;margin-bottom:8px"></div><button id="pwb" style="background:#1565c0;color:#fff;border:none;border-radius:8px;padding:10px 32px;font-size:1rem;cursor:pointer;width:100%">入る</button></div>';document.body.appendChild(o);function chk(){var v=document.getElementById('pwi').value;if(v===H){sessionStorage.setItem('cps',H);o.remove();}else document.getElementById('pwe').textContent='パスワードが違います';}document.getElementById('pwb').addEventListener('click',chk);document.getElementById('pwi').addEventListener('keydown',function(e){if(e.key==='Enter')chk();});})();</script>
<header class="header">
  <div class="header-inner">
    
    <a class="header-logo" href="">&#127891; 競プロ教材</a>
    <span class="header-sub">小学生向け AtCoder 解説集</span>
  </div>
</header>

<main class="list-view">
  <div class="filters">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" id="search" placeholder="タイトル・タグで検索..." autocomplete="off">
    </div>
    <div class="diff-filters" id="dfilters"><button class="diff-btn active" data-diff="">すべて</button><button class="diff-btn" data-diff="3" style="--dc:#ff9800">C問題レベル</button><button class="diff-btn" data-diff="4" style="--dc:#f44336">D問題レベル</button></div>
  </div>
  <div class="problem-grid" id="grid">
<a class="problem-card" href="problems/typical90_a.html"
   data-diff="4"
   data-title="yokan party"
   data-tags="二分探索 貪欲"
   data-contest="典型90問">
  <div class="card-top">
    <span class="card-contest">典型90問 001</span>
    <span class="diff-badge" style="background:#f44336">D問題レベル</span>
  </div>
  <div class="card-title">Yokan Party</div>
  <div class="card-tags"><span class="tag">二分探索</span><span class="tag">貪欲</span></div>
</a>
<a class="problem-card" href="problems/typical90_b.html"
   data-diff="3"
   data-title="encyclopedia of parentheses"
   data-tags="再帰 バックトラッキング 全探索 括弧列"
   data-contest="典型90問">
  <div class="card-top">
    <span class="card-contest">典型90問 002</span>
    <span class="diff-badge" style="background:#ff9800">C問題レベル</span>
  </div>
  <div class="card-title">Encyclopedia of Parentheses</div>
  <div class="card-tags"><span class="tag">再帰</span><span class="tag">バックトラッキング</span><span class="tag">全探索</span><span class="tag">括弧列</span></div>
</a></div>
  <div class="empty" id="empty" hidden>問題が見つかりませんでした</div>
</main>
<script>
(function(){
  var grid=document.getElementById('grid'),search=document.getElementById('search'),
      empty=document.getElementById('empty'),cards=Array.from(grid.querySelectorAll('.problem-card')),curD='';
  function filter(){
    var q=search.value.toLowerCase(),v=0;
    cards.forEach(function(c){
      var ok=(!curD||c.dataset.diff===curD)&&(!q||c.dataset.title.includes(q)||c.dataset.tags.includes(q)||c.dataset.contest.includes(q));
      c.hidden=!ok; if(ok)v++;
    });
    empty.hidden=v>0;
  }
  search.addEventListener('input',filter);
  document.getElementById('dfilters').addEventListener('click',function(e){
    var b=e.target.closest('.diff-btn'); if(!b)return;
    curD=b.dataset.diff;
    document.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); filter();
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
